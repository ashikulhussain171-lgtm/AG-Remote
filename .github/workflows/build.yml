name: Build APK and bridge

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/AG-Remote.apk

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build bridge executables
        working-directory: bridge
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/AGRemote-Bridge.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/AGRemote-Bridge-arm64.exe .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/AGRemote-Bridge-mac-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/AGRemote-Bridge-mac-intel .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/AGRemote-Bridge-linux .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ag-remote
          path: dist/*

      - name: Publish "latest" release (direct download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --title "AG Remote latest build" --notes "APK: AG-Remote.apk (phone). Laptop: AGRemote-Bridge.exe (Windows). Built from ${GITHUB_SHA::7}."
