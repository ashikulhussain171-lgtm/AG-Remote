name: Publish Lumber Inc mod

on:
  push:
    paths:
      - 'lumber-inc-mod/release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check hash
        run: |
          ASSET=$(cat lumber-inc-mod/release/ASSET)
          7z x -y lumber-inc-mod/release/*.7z.001
          echo "$(cat lumber-inc-mod/release/SHA256)  $ASSET" | sha256sum -c -
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "TAG=$(cat lumber-inc-mod/release/TAG)" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Lumber Inc 1.13.3 - Panther Mods menu" \
            --notes-file lumber-inc-mod/RELEASE_NOTES.md
