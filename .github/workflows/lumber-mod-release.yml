name: Publish Lumber Inc mod

on:
  push:
    paths:
      - 'lumber-inc-mod/release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join parts and check hash
        run: |
          7z x -y lumber-inc-mod/release/Lumber.Inc_1.13.3_mod.7z.001
          echo "$(cat lumber-inc-mod/release/SHA256)  Lumber.Inc_1.13.3_mod.apks" | sha256sum -c -
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lumber-mod-1.13.3 --yes --cleanup-tag || true
          gh release create lumber-mod-1.13.3 Lumber.Inc_1.13.3_mod.apks \
            --target "$GITHUB_SHA" \
            --title "Lumber Inc 1.13.3 - currency mod" \
            --notes-file lumber-inc-mod/RELEASE_NOTES.md
